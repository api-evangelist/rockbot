openapi: 3.0.3
info:
  title: Rockbot API
  version: '5.0'
  x-apisjson-generated: '2026-07-21'
  x-apisjson-method: generated
  x-apisjson-source: https://developer.rockbot.com/api.html
  description: >-
    Rockbot's external REST API (v5) lets business customers programmatically
    control in-location media across their zones and device groups: music
    playback, audio messaging campaigns, digital-signage campaigns, device
    status/remote control, and playback history/analytics exports. This
