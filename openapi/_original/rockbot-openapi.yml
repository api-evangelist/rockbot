      operationId: createAccessToken
      tags: [Auth]
      summary: Exchange client credentials for an access token
      description: >-
        Exchange a CLIENT_ID / CLIENT_SECRET pair (issued by Rockbot support)
        for a bearer ACCESS_TOKEN. Tokens are valid for 24 hours.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, client_secret]
              properties:
                client_id: { type: string }
                client_secret: { type: string }
      responses:
        '200':
          description: Access token issued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, example: Bearer }
                  expires_in: { type: integer, description: Seconds until expiry (24h). }
        '401': { $ref: '#/components/responses/Unauthorized' }
