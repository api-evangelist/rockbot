components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: >-
        OAuth 2.0 Client Credentials grant. Exchange a CLIENT_ID/CLIENT_SECRET
        (issued by Rockbot support) at the token endpoint for a 24-hour bearer
        ACCESS_TOKEN, then send it as `Authorization: Bearer ACCESS_TOKEN`.
      flows:
        clientCredentials:
          tokenUrl: https://api.rockbot.com/v5/api-clients/token
          scopes: {}
  parameters:
    limit:
      name: limit
      in: query
      description: Page size for paginated results.
      schema: { type: integer }
    offset:
      name: offset
      in: query
      description: Zero-based offset for paginated results.
      schema: { type: integer }
  responses:
    Object:
      description: Success. Returns a JSON object or array.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    Paginated:
      description: Paginated collection.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PaginatedResponse' }
    ExportJob:
      description: Export job state.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ExportJob' }
    Unauthorized:
      description: Missing or invalid bearer access token.
    RateLimited:
      description: >-
        Rate limit exceeded. The default limit is 1 request per second.
  schemas:
    PaginatedResponse:
      type: object
      description: Common pagination envelope shared by paginated endpoints.
      properties:
        total_count: { type: integer }
        page_size: { type: integer }
        page: { type: integer }
        page_count: { type: integer }
        data:
          type: array
          items: { type: object, additionalProperties: true }
    ExportJob:
      type: object
      description: >-
        Asynchronous export job. On completion, `url` holds a presigned link to
        a JSONL download valid until `expires_at`.
      properties:
        job_id: { type: string }
        status: { type: string }
        url: { type: string, format: uri }
        expires_at: { type: string, format: date-time }
