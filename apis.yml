aid: rockbot
name: Rockbot
description: >-
  Rockbot is a unified in-location media platform for businesses, giving multi-location
  operators one system to control background music, audio messaging, digital signage,
  Rockbot TV, music videos, and retail-media advertising across their venues. Its v5
  REST API lets customers programmatically manage that estate: control music playback
  and playlist overrides per zone, run audio-messaging and signage campaigns by group
  or zone, upload and attach assets, check device status / screenshots and reboot
  players remotely, and pull or export music, messaging, and signage playback history.
  Authentication is OAuth 2.0 client-credentials issuing 24-hour bearer tokens, with a
  documented default rate limit of one request per second. Rockbot is a GV (Google
  Ventures) portfolio company in the consumer sector.
