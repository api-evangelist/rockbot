notes: >-
  Rockbot publishes real, self-serve, per-unit list pricing — unusual for an
  in-location media platform. The unit is a ZONE (one venue/area), not a seat or
  an API call. Prices shown are the ANNUAL toggle (the page's default) and the
  page footnotes "Pricing based on 12-month term." A Monthly toggle exists but is
  rendered client-side and its values were not readable from the served HTML, so
  monthly prices are recorded as null rather than guessed.
  IMPORTANT: these are PRODUCT plans, not API plans. Rockbot publishes no
  API-specific pricing, no metered API tier, and no per-request charge. API
  access is granted on request to existing customers by emailing
  support@rockbot.com (developer.rockbot.com/start.html) at no separately
  published price, and is governed by a rate limit rather than a quota — see
  rate-limits/rockbot-rate-limits.yml.
