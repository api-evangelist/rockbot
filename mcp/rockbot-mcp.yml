notes: >-
  UPGRADED 2026-08-13 from "derived candidate" to "probed, published". Rockbot
  ships a REAL remote MCP server at https://api.rockbot.com/v5/mcp. It is not
  mentioned anywhere on developer.rockbot.com, rockbot.com/llms.txt, or the
  Zendesk help center — it was found via RFC 9728 OAuth Protected Resource
  Metadata at https://api.rockbot.com/.well-known/oauth-protected-resource, which
  advertises resource_name "Rockbot MCP" and an authentik authorization server.
  The endpoint answers POST and GET with HTTP 401 `no bearer token` plus a
  WWW-Authenticate challenge carrying path-scoped resource metadata, so the
  server's existence, transport, and auth model are directly observed. The live
  tool set is NOT: tools/list requires an OAuth bearer token, so the tools[]
  below remain a DERIVED CANDIDATE list built from the operations in
  openapi/_original/rockbot-openapi.yml. Real inputSchemas require authenticated
  introspection — do not present these names as the server's published tools.
server:
  name: Rockbot MCP
  transport: http
  url: https://api.rockbot.com/v5/mcp
  resource_metadata: https://api.rockbot.com/.well-known/oauth-protected-resource/v5/mcp
deployment:
  mode: remote
  endpoint: https://api.rockbot.com/v5/mcp
  auth: oauth
  verified: probed
  checked: '2026-08-13'
  note: >-
    Remote only. No stdio package, npx command, or MCP install snippet is
    published by Rockbot anywhere we could find; nothing exists on npm or PyPI
    (see packages/rockbot-packages.yml). An agent can reach this endpoint over
    HTTPS today provided it can complete the OAuth flow.
authorization:
  spec: RFC 9728 OAuth 2.0 Protected Resource Metadata
  resource: https://api.rockbot.com/v5/mcp
  resource_name: Rockbot MCP
  bearer_methods_supported: [header]
  authorization_servers:
    - https://auth.rockbot.com/application/o/mcp-server/
  authorization_server_software: authentik 2026.5.4
  metadata_document: well-known/rockbot-mcp-authorization-server.json
  authorization_endpoint: https://auth.rockbot.com/application/o/authorize/
  token_endpoint: https://auth.rockbot.com/application/o/token/
  grant_types_supported:
    - authorization_code
    - refresh_token
    - client_credentials
    - urn:ietf:params:oauth:grant-type:device_code
  code_challenge_methods_supported: [S256, plain]
  scopes_supported: [openid, email, profile]
  note: >-
    The MCP surface authenticates against a SEPARATE authorization server from
    the v5 REST API. REST uses OAuth 2.0 client-credentials against
    https://api.rockbot.com/v5/api-clients/token with credentials issued by
    Rockbot support; MCP uses the authentik issuer above. Only the OIDC scopes
    (openid/email/profile) are advertised — no Rockbot resource scopes appear in
    the discovery document.
