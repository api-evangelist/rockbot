    description: A music playlist available to a zone.
  - name: PlaylistOverride
    description: A temporary playlist override applied to a zone.
  - name: Campaign
    description: An audio-messaging or signage campaign, scoped to a group or a zone; scheduled via iCal RRULE.
  - name: Asset
    description: An uploaded audio or signage file, scoped to a group or a zone, attachable to campaigns.
  - name: PlaybackHistory
    description: Zone-level playback records for music, messaging, and signage.
  - name: ExportJob
    description: An asynchronous history-export job producing a presigned JSONL download.
