overlay: 1.0.0
info:
  title: API Evangelist enhancements for Rockbot API
  version: 1.0.0
extends: openapi/rockbot-openapi.yml
actions:
  - target: $.info
    update:
      x-apievangelist-enriched: '2026-07-21'
      x-apievangelist-source: https://developer.rockbot.com
      x-apievangelist-notes: >-
        Spec generated by the API Evangelist enrichment pipeline from public
        documentation; Rockbot publishes no machine-readable OpenAPI.
  - target: $.info
    update:
      x-rate-limit-default: 1 request per second
      x-auth-model: oauth2-client-credentials
  - target: $.paths['/ext/music/skip'].post
    update:
      x-rate-limit: 6 skips per hour
  - target: $.paths['/ext/data/history/exports/{job_id}'].get
    update:
      x-async-pattern: poll-until-complete presigned JSONL download
